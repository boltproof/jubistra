<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jubistra — Coming Soon</title>
<meta name="description" content="Jubistra — something new is on the way. Check back soon.">
<meta name="theme-color" content="#2D6A4F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232D6A4F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23D8F3DC' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green-deep:#1B4332;--green-primary:#2D6A4F;--green-light:#52B788;--green-pale:#D8F3DC;--cream:#FAFCF9;--text:#1A2E22;--muted:#6B7B72}
html{color-scheme:light}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;background:var(--cream);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(170deg,#EAF5ED 0%,#FAFCF9 55%,#FFF 100%)}
.card{text-align:center;max-width:520px;padding:0 24px}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-block{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--green-primary),var(--green-light));box-shadow:0 4px 16px rgba(45,106,79,.25);position:relative;overflow:hidden}
.logo-block::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0,transparent 50%)}
.logo span{font-family:Georgia,serif;font-weight:700;font-size:28px;color:var(--green-primary)}
h1{font-family:Georgia,serif;font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px;color:var(--text)}
p{font-size:17px;line-height:1.6;color:var(--muted);margin-bottom:8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-light);margin:0 8px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
footer{margin-top:48px;font-size:13px;color:var(--muted);opacity:.6}
a{color:var(--green-primary);text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo"><div class="logo-block"></div><span>Jubistra</span></div>
<h1>We're building something new</h1>
<p>Real UK &amp; Ireland towns, recreated in Minecraft.</p>
<p>Check back soon<span class="dot"></span></p>
<footer>&copy; 2026 Jubistra</footer>
</div>
</body>
</html>
